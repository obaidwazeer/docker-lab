services:

  nginx:
    image: nginx:1.30.5-alpine3.24

    ports:
      - "8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app:/var/www/html:ro

    depends_on:
      php:
        condition: service_healthy

    networks:
      - frontend
      - backend

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3


  php:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ./app:/var/www/html:ro

    expose:
      - "9000"

    networks:
      - backend

    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3


  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: docker_app
      MYSQL_USER: docker_user
      MYSQL_PASSWORD: docker_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10


networks:
  frontend:
  backend:


volumes:
  mysql-data: