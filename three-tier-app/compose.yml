services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - api 
  api:
    build: ./backend
    environment:
      - DB_HOST=db
      - DB_USER=devops
      - DB_PASS=secret123
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=devops
      - POSTGRES_PASSWORD=secret123
    volumes:
      - postgres_data=/var/lib/postgresql/data
    
volumes:
  postgres_data: 